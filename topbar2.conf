conky.config = {
    -- Second strip: directly below the main topbar (main strip is 20px tall)
    alignment = 'top_left',
    gap_x = 0,
    gap_y = 20,

    minimum_width = 1920,
    maximum_width = 1920,
    minimum_height = 20,

    own_window = true,
    -- Normal layer with 'below' keeps the strip under normal windows.
    own_window_type = 'normal',
    own_window_hints = 'below,sticky,skip_taskbar,skip_pager,undecorated',
    own_window_class = 'conky2',

    -- Transparent background via alpha in own_window_colour (#AARRGGBB)
    own_window_colour = '#00000000',

    double_buffer = true,
    border_width = 0,
    border_inner_margin = 0,
    border_outer_margin = 0,
    draw_shades = false,
    draw_outline = false,

    use_xft = true,
    font = 'SF Pro Text:size=9',
    default_color = 'FFFFFF',
    top_name_width = 16,

    background = false,
    update_interval = 1,
}

-- Template: replace this block with the modules you want in the second strip.
-- It is started as a second conky process (see conky-autostart), so its window
-- is drawn directly under the main strip.
--
-- The ${goto N} values are copied from topbar.conf, so every module below
-- starts at exactly the same X position as the corresponding main module.
-- A small blue dot marks every empty column — replace each one with your own
-- content, keeping its ${goto N} unchanged.
--
-- Column 4 (goto 330) holds a vertical list of the 10 top CPU processes.
-- Column 6 (goto 750) holds a vertical list of the 10 top MEM processes.
-- Column 10 (goto 1220) lists every mounted filesystem (all disks /
-- partitions / tmpfs) with free space, plus all external-disk devices
-- and their unmounted partitions (size from lsblk).
-- Column 11 (goto 1380) lists the 10 processes using the most swap.
conky.text = [[
${goto 22}${color 2092d0}·${goto 80}${color 2092d0}·${goto 240}${color 2092d0}·${goto 330}${color FFFFFF}${top name 1} ${color 00FF00}${top cpu 1}%${color FFFFFF}${goto 545}${color 2092d0}·${goto 750}${color FFFFFF}${top_mem name 1} ${color 2092d0}${top_mem mem 1}%${color FFFFFF}${goto 915}${color 2092d0}·${goto 1010}${color 2092d0}·${goto 1130}${color 2092d0}·${goto 1220}${color FFFFFF}/ ${color 2092d0}${fs_free /}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 1}${goto 1540}${color 2092d0}·${goto 1750}${color 2092d0}·
${goto 330}${color FFFFFF}${top name 2} ${color 00FF00}${top cpu 2}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 2} ${color 2092d0}${top_mem mem 2}%${color FFFFFF}${goto 1220}${color FFFFFF}/dev ${color 2092d0}${fs_free /dev}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 2}
${goto 330}${color FFFFFF}${top name 3} ${color 00FF00}${top cpu 3}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 3} ${color 2092d0}${top_mem mem 3}%${color FFFFFF}${goto 1220}${color FFFFFF}shm ${color 2092d0}${fs_free /dev/shm}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 3}
${goto 330}${color FFFFFF}${top name 4} ${color 00FF00}${top cpu 4}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 4} ${color 2092d0}${top_mem mem 4}%${color FFFFFF}${goto 1220}${color FFFFFF}efivars ${color 2092d0}${fs_free /sys/firmware/efi/efivars}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 4}
${goto 330}${color FFFFFF}${top name 5} ${color 00FF00}${top cpu 5}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 5} ${color 2092d0}${top_mem mem 5}%${color FFFFFF}${goto 1220}${color FFFFFF}/run ${color 2092d0}${fs_free /run}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 5}
${goto 330}${color FFFFFF}${top name 6} ${color 00FF00}${top cpu 6}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 6} ${color 2092d0}${top_mem mem 6}%${color FFFFFF}${goto 1220}${color FFFFFF}cred-j ${color 2092d0}${fs_free /run/credentials/systemd-journald.service}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 6}
${goto 330}${color FFFFFF}${top name 7} ${color 00FF00}${top cpu 7}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 7} ${color 2092d0}${top_mem mem 7}%${color FFFFFF}${goto 1220}${color FFFFFF}cred-r ${color 2092d0}${fs_free /run/credentials/systemd-resolved.service}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 7}
${goto 330}${color FFFFFF}${top name 8} ${color 00FF00}${top cpu 8}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 8} ${color 2092d0}${top_mem mem 8}%${color FFFFFF}${goto 1220}${color FFFFFF}efi ${color 2092d0}${fs_free /boot/efi}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 8}
${goto 330}${color FFFFFF}${top name 9} ${color 00FF00}${top cpu 9}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 9} ${color 2092d0}${top_mem mem 9}%${color FFFFFF}${goto 1220}${color FFFFFF}/home ${color 2092d0}${fs_free /home}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 9}
${goto 330}${color FFFFFF}${top name 10} ${color 00FF00}${top cpu 10}%${color FFFFFF}${goto 750}${color FFFFFF}${top_mem name 10} ${color 2092d0}${top_mem mem 10}%${color FFFFFF}${goto 1220}${color FFFFFF}/root ${color 2092d0}${fs_free /root}${goto 1380}${color 2092d0}${execi 10 bash /home/topsh/.config/conky/swap_procs.sh 10}
${goto 1220}${color FFFFFF}/tmp ${color 2092d0}${fs_free /tmp}
${goto 1220}${color FFFFFF}/srv ${color 2092d0}${fs_free /srv}
${goto 1220}${color FFFFFF}var/cache ${color 2092d0}${fs_free /var/cache}
${goto 1220}${color FFFFFF}sda2 ${color 2092d0}${fs_free /run/media/topsh/62AEA025AE9FF031}
${goto 1220}${color FFFFFF}var/log ${color 2092d0}${fs_free /var/log}
${goto 1220}${color FFFFFF}var/tmp ${color 2092d0}${fs_free /var/tmp}
${goto 1220}${color FFFFFF}run/user ${color 2092d0}${fs_free /run/user/1000}
${goto 1220}${color FFFFFF}sdb2 ${color 2092d0}${fs_free /run/media/topsh/ADATA HD680}
${goto 1220}${color FFFFFF}sda ${color 2092d0}${execi 300 lsblk -n -o SIZE /dev/sda | awk 'NR==1{printf "%s",$1}'}
${goto 1220}${color FFFFFF}sda1 ${color 2092d0}${execi 300 lsblk -n -o SIZE /dev/sda1 | awk 'NR==1{printf "%s",$1}'}
${goto 1220}${color FFFFFF}sda3 ${color 2092d0}${execi 300 lsblk -n -o SIZE /dev/sda3 | awk 'NR==1{printf "%s",$1}'}
${goto 1220}${color FFFFFF}sda4 ${color 2092d0}${execi 300 lsblk -n -o SIZE /dev/sda4 | awk 'NR==1{printf "%s",$1}'}
${goto 1220}${color FFFFFF}sdb ${color 2092d0}${execi 300 lsblk -n -o SIZE /dev/sdb | awk 'NR==1{printf "%s",$1}'}
${goto 1220}${color FFFFFF}sdb1 ${color 2092d0}${execi 300 lsblk -n -o SIZE /dev/sdb1 | awk 'NR==1{printf "%s",$1}'}
]]
